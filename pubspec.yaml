name: finova
description: "FINOVA - Enterprise-Grade Cross-Platform Finance Management System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Routing & Dependency Injection
  get: ^4.6.6

  # REST API Client & Networking (Backend-Only Architecture)
  dio: ^5.7.0
  http: ^1.2.2

  # High-Precision Monetary Math (Zero binary float rounding error)
  decimal: ^3.0.2

  # Modern Charting (Desktop, Web, Mobile)
  fl_chart: ^0.70.0

  # Internationalization & Currency Formatting
  intl: ^0.20.0

  # Offline-First Persistence (Drift SQLite & Network Connectivity)
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  connectivity_plus: ^6.0.5

  # Cross-Platform Local Storage & Secure Token Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UUID generation
  uuid: ^4.5.1

  # Responsive Framework
  responsive_framework: ^1.5.1

  # Vector Icons
  lucide_icons: ^0.257.0

  # File / PDF Printing & Export
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.20.2
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
